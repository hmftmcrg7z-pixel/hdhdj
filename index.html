<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我要上课了</title>
  <style>
    :root {
      --bg: #f3f2ee;
      --face: #f5efe7;
      --hair: #2b2a2f;
      --hair-dark: #141317;
      --glass-line: #2a2a2a;
      --mask: #f6f3ef;
      --shirt: #f7f7f7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .portrait {
      position: relative;
      width: min(74vmin, 760px);
      height: min(92vmin, 920px);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 20px 30px rgba(30, 24, 20, 0.12));
    }

    .figure {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .head {
      position: relative;
      width: 72%;
      height: 62%;
      margin-top: 6%;
    }

    .ear {
      position: absolute;
      top: 0;
      width: 24%;
      height: 26%;
      background: var(--hair);
      border: 10px solid var(--glass-line);
      border-bottom: none;
      border-radius: 53% 47% 0 0 / 100% 100% 0 0;
      z-index: 1;
    }

    .ear.left {
      left: 18%;
      transform: rotate(-8deg);
    }

    .ear.right {
      right: 18%;
      transform: scaleX(-1) rotate(-8deg);
    }

    .ear::before {
      content: "";
      position: absolute;
      inset: 14% 18% 18% 18%;
      background: #d9d9d9;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      opacity: 0.9;
    }

    .hair {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--hair-dark) 0%, var(--hair) 34%, #1e1d22 100%);
      border-radius: 46% 46% 48% 48% / 24% 24% 60% 60%;
      box-shadow: inset 0 -18px 20px rgba(255,255,255,0.08);
      z-index: 2;
    }

    .bang {
      position: absolute;
      left: 22%;
      top: 4%;
      width: 56%;
      height: 14%;
      background: linear-gradient(180deg, #181819 0%, #1f2024 100%);
      border-radius: 50% 50% 45% 45% / 100% 100% 0 0;
      transform: rotate(-1deg);
      z-index: 5;
    }

    .sidehair {
      position: absolute;
      width: 18%;
      height: 42%;
      background: linear-gradient(180deg, var(--hair-dark), var(--hair));
      top: 14%;
      z-index: 4;
      border-radius: 35% 35% 50% 50%;
    }

    .sidehair.left {
      left: -2%;
      transform: rotate(-18deg);
    }

    .sidehair.right {
      right: -2%;
      transform: scaleX(-1) rotate(-18deg);
    }

    .face {
      position: absolute;
      left: 50%;
      top: 19%;
      transform: translateX(-50%);
      width: 80%;
      height: 53%;
      background: radial-gradient(circle at 50% 32%, #f8f4ef 0%, var(--face) 48%, #e9dfd6 100%);
      border-radius: 44% 44% 46% 46% / 42% 42% 58% 58%;
      z-index: 6;
      box-shadow: inset 0 -18px 18px rgba(166, 148, 134, 0.18);
    }

    .eye {
      position: absolute;
      top: 38%;
      width: 31%;
      height: 19%;
      background: rgba(255,255,255,0.64);
      border: 11px solid var(--glass-line);
      border-radius: 48% 48% 52% 52% / 48% 48% 52% 52%;
      overflow: hidden;
      z-index: 7;
    }

    .eye.left {
      left: 12%;
      transform: rotate(-2deg);
    }

    .eye.right {
      right: 12%;
      transform: rotate(2deg);
    }

    .eye::before {
      content: "";
      position: absolute;
      inset: 12% 10% 12% 10%;
      background: rgba(10, 8, 8, 0.96);
      border-radius: 48% 52% 50% 50% / 48% 48% 52% 52%;
      box-shadow: inset 0 0 0 8px rgba(20, 20, 20, 0.18);
    }

    .eye::after {
      content: "";
      position: absolute;
      width: 22%;
      height: 25%;
      left: 24%;
      top: 22%;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      filter: blur(1px);
    }

    .bridge {
      position: absolute;
      left: 50%;
      top: 45%;
      width: 18%;
      height: 8%;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(36, 36, 36, 0.18);
      z-index: 8;
    }

    .mask {
      position: absolute;
      left: 50%;
      bottom: 13%;
      transform: translateX(-50%);
      width: 62%;
      height: 18%;
      background: linear-gradient(180deg, #fdfcfb 0%, #f5f1ed 100%);
      border-radius: 48% 48% 54% 54% / 56% 56% 44% 44%;
      box-shadow: inset 0 -8px 10px rgba(194, 180, 170, 0.25);
      z-index: 8;
    }

    .mask::before,
    .mask::after {
      content: "";
      position: absolute;
      width: 18%;
      height: 30%;
      background: rgba(150, 136, 123, 0.18);
      bottom: 12%;
      border-radius: 50%;
    }

    .mask::before {
      left: 14%;
    }

    .mask::after {
      right: 14%;
    }

    .nose {
      position: absolute;
      left: 50%;
      bottom: 33%;
      width: 10%;
      height: 8%;
      transform: translateX(-50%);
      background: rgba(203, 186, 173, 0.45);
      border-radius: 50% 50% 70% 70%;
      z-index: 9;
    }

    .cheek {
      position: absolute;
      width: 12%;
      height: 8%;
      bottom: 28%;
      background: rgba(223, 150, 142, 0.18);
      border-radius: 50%;
      z-index: 9;
    }

    .cheek.left { left: 18%; }
    .cheek.right { right: 18%; }

    .neck {
      position: absolute;
      left: 50%;
      bottom: -10%;
      transform: translateX(-50%);
      width: 20%;
      height: 17%;
      background: linear-gradient(180deg, #f5e8dd 0%, #e8d9cb 100%);
      border-radius: 0 0 25% 25%;
      z-index: 3;
    }

    .shirt {
      position: absolute;
      left: 50%;
      bottom: -18%;
      transform: translateX(-50%);
      width: 66%;
      height: 22%;
      background: linear-gradient(180deg, #fdfdfd 0%, #f0f0f0 100%);
      border-radius: 22% 22% 0 0 / 38% 38% 0 0;
      z-index: 1;
      box-shadow: inset 0 10px 15px rgba(0,0,0,0.02);
    }

    .shirt::before,
    .shirt::after {
      content: "";
      position: absolute;
      width: 26%;
      height: 100%;
      top: 0;
      background: rgba(17, 17, 17, 0.88);
      border-radius: 0 0 18% 18%;
    }

    .shirt::before {
      left: 18%;
      transform: skewX(-24deg);
    }

    .shirt::after {
      right: 18%;
      transform: skewX(24deg);
    }

    .shirt .line {
      position: absolute;
      left: 50%;
      top: 16%;
      width: 38%;
      height: 12%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(10,10,10,0.9), rgba(35,35,35,0.85));
      border-radius: 999px;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.04);
    }

    @media (max-width: 640px) {
      .portrait {
        width: 88vw;
        height: 90vh;
      }

      .head {
        width: 78%;
      }
    }
  </style>
</head>
<body>
  <div class="portrait" aria-label="cartoon portrait">
    <div class="figure">
      <div class="head">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="hair"></div>
        <div class="bang"></div>
        <div class="sidehair left"></div>
        <div class="sidehair right"></div>
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="bridge"></div>
          <div class="cheek left"></div>
          <div class="cheek right"></div>
          <div class="nose"></div>
          <div class="mask"></div>
        </div>
        <div class="neck"></div>
      </div>
      <div class="shirt"><div class="line"></div></div>
    </div>
  </div>
</body>
</html>
