<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>背景人物</title>
  <style>
    :root {
      --wall: #efece8;
      --wall-shadow: #d9d3cc;
      --hair: #1d1d20;
      --hair-dark: #0f1012;
      --face: #f5efe9;
      --face-shadow: #d9d0c7;
      --glass: #f4efe8;
      --glass-line: #2e2e2f;
      --mask: #f7f4ef;
      --shirt: #fafafa;
      --shirt-dark: #171819;
      --blush: rgba(210, 150, 144, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--wall);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.04) 0 1px, transparent 1px 100%),
        linear-gradient(rgba(0,0,0,0.03) 0 1px, transparent 1px 100%),
        #f5f2ee;
      background-size: 26px 26px, 26px 26px, 100% 100%;
    }

    .scene {
      position: relative;
      width: min(94vw, 1200px);
      height: min(96vh, 1000px);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 16px 24px rgba(50, 42, 36, 0.14));
    }

    .portrait {
      position: relative;
      width: min(78vw, 880px);
      height: min(90vh, 920px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .figure {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hair-wrap {
      position: absolute;
      left: 50%;
      top: 4%;
      transform: translateX(-50%);
      width: 78%;
      height: 76%;
      z-index: 1;
    }

    .ear {
      position: absolute;
      top: 0;
      width: 26%;
      height: 24%;
      background: linear-gradient(180deg, #1e1f22, #121315);
      border: 10px solid var(--glass-line);
      border-bottom: none;
      border-radius: 52% 48% 0 0 / 100% 100% 0 0;
      z-index: 1;
    }

    .ear.left {
      left: 15%;
      transform: rotate(-9deg);
    }

    .ear.right {
      right: 15%;
      transform: scaleX(-1) rotate(-9deg);
    }

    .ear::before {
      content: "";
      position: absolute;
      inset: 18% 22% 18% 22%;
      background: rgba(255,255,255,0.65);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      opacity: 0.8;
    }

    .hair {
      position: absolute;
      inset: 3% 0 0 0;
      background: linear-gradient(180deg, #1c1c1e 0%, #2a2a2d 24%, #141517 100%);
      border-radius: 46% 46% 46% 46% / 24% 24% 60% 60%;
      z-index: 2;
      box-shadow: inset 0 -18px 24px rgba(255,255,255,0.06);
    }

    .bang {
      position: absolute;
      left: 20%;
      top: 3%;
      width: 60%;
      height: 14%;
      background: linear-gradient(180deg, #141518, #1b1d20);
      border-radius: 48% 52% 42% 40% / 100% 100% 0 0;
      transform: rotate(-1deg);
      z-index: 4;
    }

    .sidehair {
      position: absolute;
      width: 20%;
      height: 38%;
      background: linear-gradient(180deg, #1a1b1d, #141517);
      top: 15%;
      border-radius: 35% 35% 52% 52%;
      z-index: 3;
    }

    .sidehair.left {
      left: -1%;
      transform: rotate(-14deg);
    }

    .sidehair.right {
      right: -1%;
      transform: scaleX(-1) rotate(-14deg);
    }

    .face {
      position: absolute;
      left: 50%;
      top: 19%;
      transform: translateX(-50%);
      width: 80%;
      height: 50%;
      background: radial-gradient(circle at 50% 35%, #fbf7f2 0%, var(--face) 46%, #e8dfd5 100%);
      border-radius: 46% 46% 46% 46% / 42% 42% 58% 58%;
      z-index: 5;
      box-shadow: inset 0 -12px 16px rgba(149,132,120,0.12);
    }

    .glass {
      position: absolute;
      top: 37%;
      width: 31%;
      height: 19%;
      background: rgba(255,255,255,0.32);
      border: 10px solid var(--glass-line);
      border-radius: 48% 48% 52% 52% / 48% 48% 52% 52%;
      overflow: hidden;
      z-index: 10;
    }

    .glass.left { left: 15%; }
    .glass.right { right: 15%; }

    .glass::before {
      content: "";
      position: absolute;
      inset: 10% 12% 11% 12%;
      background: rgba(15,11,10,0.97);
      border-radius: 48% 52% 50% 50% / 48% 48% 52% 52%;
      box-shadow: inset 0 0 0 8px rgba(17,17,17,0.15);
    }

    .glass::after {
      content: "";
      position: absolute;
      width: 22%;
      height: 24%;
      left: 24%;
      top: 22%;
      background: rgba(255,255,255,0.43);
      border-radius: 50%;
    }

    .bridge {
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translateX(-50%);
      width: 18%;
      height: 8%;
      background: rgba(33,33,33,0.18);
      border-radius: 999px;
      z-index: 11;
    }

    .mask {
      position: absolute;
      left: 50%;
      bottom: 10%;
      transform: translateX(-50%);
      width: 62%;
      height: 20%;
      background: linear-gradient(180deg, #fffdfb, #f1ece7);
      border-radius: 48% 48% 54% 54% / 58% 58% 42% 42%;
      box-shadow: inset 0 -10px 12px rgba(162,146,134,0.18);
      z-index: 13;
    }

    .mask::before,
    .mask::after {
      content: "";
      position: absolute;
      width: 18%;
      height: 30%;
      bottom: 12%;
      background: rgba(157, 141, 129, 0.14);
      border-radius: 50%;
    }

    .mask::before { left: 14%; }
    .mask::after { right: 14%; }

    .nose {
      position: absolute;
      left: 50%;
      bottom: 30%;
      transform: translateX(-50%);
      width: 10%;
      height: 8%;
      background: rgba(205, 187, 175, 0.44);
      border-radius: 50% 50% 65% 65%;
      z-index: 14;
    }

    .blush {
      position: absolute;
      width: 11%;
      height: 8%;
      bottom: 29%;
      background: var(--blush);
      border-radius: 50%;
      z-index: 14;
    }

    .blush.left { left: 18%; }
    .blush.right { right: 18%; }

    .neck {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 20%;
      height: 15%;
      background: linear-gradient(180deg, #f2e7dc, #e5d3c4);
      border-radius: 0 0 26% 26%;
      z-index: 2;
    }

    .shirt {
      position: absolute;
      left: 50%;
      bottom: -10%;
      transform: translateX(-50%);
      width: 64%;
      height: 20%;
      background: linear-gradient(180deg, #fefefe, #efefef);
      border-radius: 24% 24% 0 0 / 38% 38% 0 0;
      box-shadow: inset 0 14px 18px rgba(0,0,0,0.02);
      z-index: 0;
    }

    .shirt::before,
    .shirt::after {
      content: "";
      position: absolute;
      width: 26%;
      height: 100%;
      top: 0;
      background: rgba(17,17,17,0.9);
      border-radius: 0 0 18% 18%;
    }

    .shirt::before {
      left: 18%;
      transform: skewX(-26deg);
    }

    .shirt::after {
      right: 18%;
      transform: skewX(26deg);
    }

    .shirt .line {
      position: absolute;
      left: 50%;
      top: 18%;
      width: 36%;
      height: 12%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(16,16,16,0.9), rgba(30,30,30,0.8));
      border-radius: 999px;
    }

    @media (max-width: 700px) {
      .portrait {
        width: 86vw;
        height: 80vh;
      }

      .hair-wrap {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="portrait" aria-label="cat face background illustration">
      <div class="figure">
        <div class="hair-wrap">
          <div class="ear left"></div>
          <div class="ear right"></div>
          <div class="hair"></div>
          <div class="bang"></div>
          <div class="sidehair left"></div>
          <div class="sidehair right"></div>
          <div class="face">
            <div class="glass left"></div>
            <div class="glass right"></div>
            <div class="bridge"></div>
            <div class="blush left"></div>
            <div class="blush right"></div>
            <div class="nose"></div>
            <div class="mask"></div>
          </div>
          <div class="neck"></div>
        </div>
        <div class="shirt"><div class="line"></div></div>
      </div>
    </div>
  </div>
</body>
</html>
